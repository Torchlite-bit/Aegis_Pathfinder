name: Release

# A GitHub release for every version that reaches main. The .toc's
# "## Version" is tagged v<version> and packaged, once: a merge that leaves the
# version alone (Tools/ or docs/ only, which take no bump) finds its tag there
# already and does nothing. Launchers that compare an installed addon with the
# latest release see the version that is on main.
#
# Two runs make a release. The push to main tags the version, then starts this
# workflow again on the tag, and that run packages it. The packager will not
# package a branch push whose commit is tagged -- "Found future tag, not
# packaging" -- because it expects the tag's own push to start a run; but a
# tag pushed with the workflow's token starts none. A dispatch does. A v* tag
# pushed by hand is packaged by its own push, as before.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the version, if it is new
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^## Version:[[:space:]]*\([^[:space:]]*\).*/\1/p' Aegis_Pathfinder.toc | tr -d '\r')
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::No MAJOR.MINOR.PATCH version in Aegis_Pathfinder.toc (got '$version')"
            exit 1
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is released already; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Aegis: Pathfinder $version"
          git push origin "$tag"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
          echo "Tagged $tag; it is packaged in the run started on the tag."

      - name: Package and release to GitHub
        if: github.ref_type == 'tag'
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
